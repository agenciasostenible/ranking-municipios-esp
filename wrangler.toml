name = "ranking-municipios-esp"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Dominios del Worker. IMPORTANTE: deben estar TODOS aquí — al desplegar, wrangler
# elimina cualquier custom domain que NO esté listado (una vez tumbó rankingspain.com por faltar).
routes = [
  { pattern = "rankingspain.com", custom_domain = true },
  { pattern = "www.rankingspain.com", custom_domain = true },
  { pattern = "nuevo.rankingspain.com", custom_domain = true }
]

# El adaptador @astrojs/cloudflare añade main (dist/server/entry.mjs) y assets (dist/client)
# a la config generada en dist/server/wrangler.json al hacer el build.

[[d1_databases]]
binding = "DB"
database_name = "ranking-municipios"
database_id = "d664746a-8439-488d-a42c-73aaf17b2140"

[[kv_namespaces]]
binding = "SESSION"
id = "fbff1b0954ca4b29905b0309273216a5"
